<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Sidebar */
        .sidebar {
            height: 100vh;
            width: 250px;
            background: linear-gradient(180deg, #1f1f1f, #0d0d0d);
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 30px;
            box-shadow: 3px 0 10px rgba(0, 0, 0, 0.5);
        }

        .sidebar h4 {
            text-align: center;
            color: orange;
            font-weight: 600;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .sidebar a {
            display: block;
            color: #ffffff;
            padding: 12px 25px;
            text-decoration: none;
            transition: 0.3s;
            font-weight: 500;
        }

        .sidebar a:hover {
            background: orange;
            color: #fff;
            border-radius: 5px;
            margin-left: 8px;
        }

        .sidebar a.active {
            background-color: orange;
            color: #fff;
            font-weight: 600;
            border-left: 4px solid #fff;
        }

        /* Topbar */
        .topbar {
            background-color: #1c1c1c;
            padding: 12px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h5 {
            margin: 0;
            color: orange;
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            padding: 30px;
        }

        /* Table Styling */
        table.table {
            background-color: #000 !important;
            /* Full black table */
            color: #ffffff;
            border-radius: 10px;
            overflow: hidden;
        }

        table.table thead {
            background-color: #111 !important;
            /* Dark header */
            color: #ffffff !important;
        }

        table.table tbody tr {
            background-color: #000 !important;
            /* Black rows */
            transition: 0.3s;
        }

        table.table tbody tr:hover {
            background-color: #1f1f1f !important;
            /* Hover effect */
        }

        /* Remove default Bootstrap row borders */
        table.table td,
        table.table th {
            border: none !important;
        }

        /* Badges */
        .badge-warning {
            background-color: #ff9800;
            color: #000;
        }

        .badge-success {
            background-color: #4caf50;
            color: #fff;
        }

        .badge-danger {
            background-color: #f44336;
            color: #fff;
        }

        /* Buttons */
        .btn {
            background-color: orange;
            border: none;
        }

        .btn:hover {
            background-color: #e69500;
            color: #fff;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background-color: orange;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h4>Admin Panel</h4>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="orders.html" class="active">📦 Orders</a>
        <a href="bookings.html">🗓️ Bookings</a>
        <a href="menuu.html">🍴 Menu</a>
        <a href="gallery.html">🖼️ Gallery</a>
        <a href="offers.html">🎁 Offers</a>
        <a href="settings.html">⚙️ Settings</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="topbar">
            <h5>Manage Orders</h5>
            <span>👤 Admin</span>
        </div>

        <div class="mt-4 table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Customer</th>
                        <th>Item</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>001</td>
                        <td>Mishri Nagar</td>
                        <td>Pizza</td>
                        <td>₹250</td>
                        <td><span class="badge bg-warning text-dark">Pending</span></td>
                        <td><button class="btn btn-sm text-white">View</button></td>
                    </tr>
                    <tr>
                        <td>002</td>
                        <td>Parth Detroja</td>
                        <td>Pasta</td>
                        <td>₹300</td>
                        <td><span class="badge bg-success">Delivered</span></td>
                        <td><button class="btn btn-sm text-white">View</button></td>
                    </tr>
                    <tr>
                        <td>003</td>
                        <td>Nikki Patel</td>
                        <td>Burger</td>
                        <td>₹200</td>
                        <td><span class="badge bg-danger">Cancelled</span></td>
                        <td><button class="btn btn-sm text-white">View</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
