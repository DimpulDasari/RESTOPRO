<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar {
            height: 100vh;
            width: 250px;
            background: linear-gradient(180deg, #1f1f1f, #0d0d0d);
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 30px;
            box-shadow: 3px 0 10px rgba(0, 0, 0, 0.5);
        }

        .sidebar h4 {
            text-align: center;
            color: orange;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .sidebar a {
            display: block;
            color: #b0b0b0;
            padding: 12px 25px;
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: orange;
            color: #fff;
            border-radius: 5px;
            margin-left: 8px;
        }

        .sidebar a.active {
            background: orange;
            color: #fff;
            font-weight: 600;
            border-left: 4px solid #fff;
        }

        .main-content {
            margin-left: 260px;
            padding: 30px;
        }

        .topbar {
            background: #1c1c1c;
            padding: 12px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h5 {
            color: orange;
            margin: 0;
        }

        .card {
            background: #1e1e1e;
            border: none;
            border-radius: 10px;
            color: #e0e0e0;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h4>Admin Panel</h4>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="orders.html">📦 Orders</a>
        <a href="bookings.html" class="active">🗓️ Bookings</a>
        <a href="menuu.html">🍴 Menu</a>
        <a href="gallery.html">🖼️ Gallery</a>
        <a href="offers.html">🎁 Offers</a>
        <a href="settings.html">⚙️ Settings</a>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h5>Bookings Management</h5>
            <span>👤 Admin</span>
        </div>
        <div class="row mt-4 g-3">
            <div class="col-md-4">
                <div class="card p-3">
                    <h6>Table Booking</h6>
                    <p>Customer: Riya Patel</p>
                    <p>Date: 6 Oct, 2025</p>
                    <p>Status: <span class="badge bg-success">Confirmed</span></p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3">
                    <h6>Event Booking</h6>
                    <p>Customer: Karan Mehta</p>
                    <p>Date: 8 Oct, 2025</p>
                    <p>Status: <span class="badge bg-warning text-dark">Pending</span></p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
