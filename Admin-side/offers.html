<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Offers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar {
            height: 100vh;
            width: 250px;
            background: linear-gradient(180deg, #1f1f1f, #0d0d0d);
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 30px;
        }

        .sidebar h4 {
            text-align: center;
            color: orange;
            margin-bottom: 40px;
        }

        .sidebar a {
            display: block;
            color: #b0b0b0;
            padding: 12px 25px;
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: orange;
            color: #fff;
            border-radius: 5px;
            margin-left: 8px;
        }

        .sidebar a.active {
            background: orange;
            color: #fff;
            font-weight: 600;
            border-left: 4px solid #fff;
        }

        .main-content {
            margin-left: 260px;
            padding: 30px;
        }

        .topbar {
            background: #1c1c1c;
            padding: 12px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card {
            background: #1e1e1e;
            border: none;
            border-radius: 10px;
            color: #e0e0e0;
        }

        .btn {
            background: orange;
            border: none;
        }

        .btn:hover {
            background: orange;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h4>Admin Panel</h4>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="orders.html">📦 Orders</a>
        <a href="bookings.html">🗓️ Bookings</a>
        <a href="menuu.html">🍴 Menu</a>
        <a href="gallery.html">🖼️ Gallery</a>
        <a href="offers.html" class="active">🎁 Offers</a>
        <a href="settings.html">⚙️ Settings</a>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h5>Offer Management</h5>
            <span>👤 Admin</span>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4">
            <h6>Active Offers</h6>
            <button class="btn text-white btn-sm">+ Add Offer</button>
        </div>

        <div class="row mt-3 g-3">
            <div class="col-md-4">
                <div class="card p-3">
                    <h6>🎉 Festive Combo Offer</h6>
                    <p>Get 20% off on all main courses till 10 Oct!</p>
                    <span class="badge bg-success">Active</span>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3">
                    <h6>🍕 Pizza Weekend</h6>
                    <p>Buy 1 Get 1 Free on every pizza order.</p>
                    <span class="badge bg-warning text-dark">Expiring Soon</span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
