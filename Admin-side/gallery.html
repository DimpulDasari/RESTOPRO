<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar {
            height: 100vh;
            width: 250px;
            background: linear-gradient(180deg, #1f1f1f, #0d0d0d);
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 30px;
        }

        .sidebar h4 {
            text-align: center;
            color: orange;
            margin-bottom: 40px;
        }

        .sidebar a {
            display: block;
            color: #ffffff;
            padding: 12px 25px;
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: orange;
            color: #fff;
            border-radius: 5px;
            margin-left: 8px;
        }

        .sidebar a.active {
            background: orange;
            color: #fff;
            font-weight: 600;
            border-left: 4px solid #fff;
        }

        .main-content {
            margin-left: 260px;
            padding: 30px;
        }

        .topbar {
            background: #1c1c1c;
            padding: 12px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
        }

        .card {
            background: #1e1e1e;
            border: none;
            border-radius: 10px;
            color: #ffffff;
        }

        .card img {
            height: 200px;
            /* Equal height for all images */
            width: 100%;
            object-fit: cover;
            /* Maintain aspect ratio, crop if needed */
            border-radius: 8px;
            margin-bottom: 10px;
        }

        /* 🔸 Button Styling (Orange Theme) */
        .btn-orange {
            background-color: orange;
            color: white;
            border: none;
            transition: 0.3s;
        }

        .btn-orange:hover {
            background-color: #e69500;
            color: #fff;
        }

        .card p {
            color: #ffffff;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h4>Admin Panel</h4>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="orders.html">📦 Orders</a>
        <a href="bookings.html">🗓️ Bookings</a>
        <a href="menuu.html">🍴 Menu</a>
        <a href="gallery.html" class="active">🖼️ Gallery</a>
        <a href="offers.html">🎁 Offers</a>
        <a href="settings.html">⚙️ Settings</a>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h5>Gallery Management</h5>
            <span>👤 Admin</span>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4">
            <h6>All Uploaded Images</h6>
            <button class="btn btn-orange btn-sm">+ Add New Image</button>
        </div>

        <div class="row mt-3 g-3">
            <div class="col-md-4">
                <div class="card p-2">
                    <img src="../images/dish.webp" alt="Food Image">
                    <p class="mt-2 text-center">Delicious Dish</p>
                    <div class="d-flex justify-content-center mb-2">
                        <button class="btn btn-orange btn-sm me-2">Edit</button>
                        <button class="btn btn-orange btn-sm">Delete</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-2">
                    <img src="../images/interior.jpg" alt="Food Image">
                    <p class="mt-2 text-center">Restaurant Interior</p>
                    <div class="d-flex justify-content-center mb-2">
                        <button class="btn btn-orange btn-sm me-2">Edit</button>
                        <button class="btn btn-orange btn-sm">Delete</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-2">
                    <img src="../images/desert.jpg" alt="Food Image">
                    <p class="mt-2 text-center">Dessert Display</p>
                    <div class="d-flex justify-content-center mb-2">
                        <button class="btn btn-orange btn-sm me-2">Edit</button>
                        <button class="btn btn-orange btn-sm">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
