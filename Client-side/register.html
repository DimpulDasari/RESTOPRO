<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Restopro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: url('../images/bg.jpg') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      animation: fadeIn 1.2s ease forwards;
    }

    .register-box {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 15px;
      width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      animation: slideUp 1.5s ease forwards;
    }

    .register-box h2 {
      text-align: center;
      color: #000;
      margin-bottom: 20px;
      animation: fadeInText 1.6s ease forwards;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.3);
      border: none;
      color: #000;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      box-shadow: 0 0 5px orange;
      background: rgba(255, 255, 255, 0.5);
    }

    .form-control.is-invalid {
      border: 2px solid red;
      background: rgba(255, 200, 200, 0.3);
    }

    .form-control::placeholder {
      color: #555;
    }

    .btn-custom {
      width: 100%;
      background: orange;
      color: white;
      border: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-custom:hover {
      background: darkorange;
      transform: scale(1.03);
    }

    .text-link {
      display: block;
      text-align: center;
      margin-top: 10px;
      color: #000;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .text-link:hover {
      color: orange;
    }

    /* Toast styling */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 2000;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInText {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="register-box">
    <h2>Register</h2>
    <form id="registerForm" novalidate>
      <div class="mb-3">
        <input type="text" id="fullname" class="form-control" placeholder="Full Name">
      </div>
      <div class="mb-3">
        <input type="email" id="email" class="form-control" placeholder="Email">
      </div>
      <div class="mb-3">
        <input type="password" id="password" class="form-control" placeholder="Password">
      </div>
      <div class="mb-3">
        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password">
      </div>
      <button type="submit" class="btn btn-custom">Register</button>
      <a href="login.html" class="text-link">Already have an account? Login</a>
    </form>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Function to show toast
    function showToast(message, type = "danger") {
      const toastContainer = document.querySelector('.toast-container');
      const toast = document.createElement('div');
      toast.className = `toast align-items-center text-bg-${type} border-0 show mb-2`;
      toast.role = 'alert';
      toast.innerHTML = `
        <div class="d-flex">
          <div class="toast-body">${message}</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      `;
      toastContainer.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    document.getElementById("registerForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const fullName = document.getElementById("fullname");
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const confirmPassword = document.getElementById("confirmPassword");

      let valid = true;

      // Reset invalid styles
      [fullName, email, password, confirmPassword].forEach(f => f.classList.remove("is-invalid"));

      // Full name validation
      if (fullName.value.trim() === "") {
        fullName.classList.add("is-invalid");
        showToast("Full name cannot be empty!");
        valid = false;
      }

      // Email validation
      const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
      if (!emailPattern.test(email.value)) {
        email.classList.add("is-invalid");
        showToast("Enter a valid email address!");
        valid = false;
      }

      // Password validation
      const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?#&_])[A-Za-z\d@$!%*?#&_]{6,}$/;
      if (!passwordPattern.test(password.value)) {
        password.classList.add("is-invalid");
        showToast("Password must contain uppercase, lowercase, number, and special character!");
        valid = false;
      }

      // Confirm password validation
      if (confirmPassword.value !== password.value || confirmPassword.value === "") {
        confirmPassword.classList.add("is-invalid");
        showToast("Passwords do not match!");
        valid = false;
      }

      if (valid) {
        showToast("Registration successful! Redirecting to login...", "success");
        this.reset();
        // Redirect after delay
        setTimeout(() => {
          window.location.href = "login.html";
        }, 2000);
      }
    });
  </script>
</body>

</html>
